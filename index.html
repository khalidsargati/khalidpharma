<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pharmacy">
<title>Pharmacy</title>
<style>
html, body { margin:0; padding:0; background:#000; color:#fff; overflow-x:hidden; }
body { font-family:-apple-system,system-ui,sans-serif; padding:10px; }

.topbar { display:flex; align-items:center; gap:8px; background:#0a0a0a; border-radius:10px; padding:8px 10px; margin-bottom:8px; border:1px solid #1a1a1a; }
.db-badge { display:flex; flex-direction:column; align-items:center; font-size:9px; color:#555; line-height:1.2; flex:0 0 auto; min-width:44px; }
.db-badge .db-count { font-size:16px; font-weight:700; color:#0d6efd; line-height:1; }
.db-badge.fresh .db-count { color:#22c55e; }
.db-badge.stale .db-count { color:#f59e0b; }
.sync-area { flex:1; display:flex; flex-direction:column; gap:3px; overflow:hidden; }
.sync-status { font-size:11px; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sync-status.ok   { color:#22c55e; }
.sync-status.warn { color:#f59e0b; }
.sync-status.err  { color:#ef4444; }
.sync-status.busy { color:#60a5fa; }
.btn-sync { padding:7px 14px; border-radius:7px; font-size:13px; font-weight:600; border:1px solid #1e3a5f; background:#0d2b4e; color:#60a5fa; cursor:pointer; white-space:nowrap; flex:0 0 auto; display:flex; align-items:center; gap:5px; }
.btn-sync:hover { background:#1a3e6e; }
.btn-sync:disabled { opacity:.4; cursor:default; }
.btn-sync.syncing { background:#1a1a00; border-color:#5a4a00; color:#f59e0b; }

.row-inputs { display:flex; gap:8px; margin-bottom:8px; }
.row-inputs select { flex:0 0 auto; width:115px; padding:12px 8px; border-radius:8px; font-size:15px; border:1px solid #222; background:#111; color:#fff; }
.row-inputs input { flex:1 1 0; padding:12px; border-radius:8px; font-size:15px; border:1px solid #222; background:#111; color:#fff; }
.row-inputs input::placeholder { color:#777; }

.row-actions { display:flex; gap:8px; margin-bottom:10px; }
.row-actions button { flex:1 1 0; display:flex; align-items:center; justify-content:center; gap:5px; padding:12px 6px; border-radius:8px; font-size:14px; font-weight:600; border:none; cursor:pointer; white-space:nowrap; }
.btn-scan   { background:#1a1a2e; color:#fff; border:1px solid #333 !important; }
.btn-scan.scanning { background:#c0392b; border-color:#e74c3c !important; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,.5)} 50%{box-shadow:0 0 0 6px rgba(231,76,60,0)} }
.btn-search { background:#0d6efd; color:#fff; }
.btn-all    { background:#2d3436; color:#fff; }
.btn-filter { background:#1e1e1e; color:#aaa; border:1px solid #333 !important; }
.btn-filter.active { background:#1c3a1c; color:#4ade80; border-color:#4ade80 !important; }
button:hover { opacity:.85; }

#info { display:flex; align-items:center; gap:8px; min-height:22px; color:#aaa; margin-bottom:6px; font-size:13px; }
.spinner { width:14px; height:14px; border:2px solid #222; border-top-color:#0d6efd; border-radius:50%; animation:spin .9s linear infinite; flex-shrink:0; }
@keyframes spin { to { transform:rotate(360deg); } }

#syncProgress { display:none; background:#111; border-radius:4px; height:4px; margin-bottom:8px; overflow:hidden; }
#syncBar { height:100%; width:0%; background:#0d6efd; border-radius:4px; transition:width .3s ease; }
#syncProgress.visible { display:block; }

#paginationBar { display:none; gap:8px; align-items:center; margin:10px 0; }
#paginationBar button { padding:10px 14px; border-radius:6px; background:#111; color:#fff; border:1px solid #222; cursor:pointer; }
.page-stats { font-size:12px; color:#888; flex:1; }

.table-wrapper { background:#000; border-radius:8px; border:1px solid #111; max-height:64vh; overflow:auto; -webkit-overflow-scrolling:touch; }
.item-name-col { white-space:normal !important; max-width:200px; width:200px; word-break:normal; overflow-wrap:break-word; }
table { border-collapse:separate; border-spacing:0; min-width:100%; background:#000; }
th, td { padding:10px; border-bottom:1px solid #111; white-space:nowrap; }
td { color:#e0e0e0; }
th { font-size:12px; text-transform:uppercase; color:#888; background:#000; }
th.sortable { cursor:pointer; user-select:none; }
th .indicator { margin-left:4px; color:#555; }
th .indicator sup { font-size:9px; color:#888; }
.table-wrapper thead tr:first-child th { position:sticky; top:0; z-index:3; background:#000; box-shadow:0 1px 0 #111; }
.filter-row { display:none; }
.filter-row.visible { display:table-row; }
.filter-row th { padding:4px 6px; background:#0a0a0a; position:sticky; top:37px; z-index:2; box-shadow:0 1px 0 #111; }
.filter-input { width:100%; box-sizing:border-box; padding:5px 7px; font-size:12px; border-radius:5px; border:1px solid #2a2a2a; background:#111; color:#fff; min-width:55px; }
.filter-input:focus { outline:none; border-color:#0d6efd; }
tr.filtered-out { display:none; }

.no-data { text-align:center; padding:40px 20px; color:#555; }
.no-data .icon { font-size:40px; margin-bottom:12px; }
.no-data h3 { margin:0 0 8px; color:#777; }
.no-data p  { margin:0; font-size:13px; line-height:1.6; }
.no-data button { margin-top:16px; padding:12px 24px; background:#0d6efd; color:#fff; border:none; border-radius:8px; font-size:14px; cursor:pointer; }

/* Splash — shown instantly from localStorage before IndexedDB loads */
#splash { position:fixed; inset:0; background:#000; z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; transition:opacity .25s ease; }
#splash.hidden { opacity:0; pointer-events:none; }
#splash .logo  { font-size:36px; }
#splash .label { font-size:14px; color:#444; }
#splash .dot-row { display:flex; gap:6px; }
#splash .dot { width:6px; height:6px; border-radius:50%; background:#222; animation:dotpulse 1.2s ease-in-out infinite; }
#splash .dot:nth-child(2) { animation-delay:.2s; }
#splash .dot:nth-child(3) { animation-delay:.4s; }
@keyframes dotpulse { 0%,80%,100%{background:#222} 40%{background:#0d6efd} }
</style>
</head>
<body>

<!-- ── Splash screen (shown immediately, hides once DB is ready) ── -->
<div id="splash">
  <div class="logo">💊</div>
  <div class="dot-row"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="label" id="splashLabel">Loading…</div>
</div>

<!-- ── Sync bar ── -->
<div class="topbar">
  <div class="db-badge" id="dbBadge">
    <span class="db-count" id="dbCount">—</span>
    <span>rows</span>
  </div>
  <div class="sync-area">
    <span class="sync-status" id="syncStatus">Checking…</span>
  </div>
  <button class="btn-sync" id="btnSync" onclick="doSync()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/>
      <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
    </svg>
    Sync
  </button>
</div>

<div id="syncProgress"><div id="syncBar"></div></div>

<div class="row-inputs">
  <select id="category">
    <option value="froshtn">Froshtn</option>
    <option value="henan">Henan</option>
    <option value="qaema">Qaema</option>
    <option value="megadata">Megadata</option>
  </select>
  <input id="searchText" placeholder="Medicine, barcode…" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false">
</div>

<div class="row-actions">
  <button class="btn-scan" id="btnScan" title="Scan Barcode">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
      <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
      <line x1="7" y1="9" x2="7" y2="15" stroke-width="2"/>
      <line x1="10" y1="8.5" x2="10" y2="15.5" stroke-width="1.5"/>
      <line x1="13" y1="9" x2="13" y2="15" stroke-width="2"/>
      <line x1="16" y1="8.5" x2="16" y2="15.5" stroke-width="1.5"/>
    </svg>
  </button>
  <button class="btn-search" id="btnSearch" onclick="handleSearch()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    Search
  </button>
  <button class="btn-all" id="btnShowAll" onclick="showAll()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="6"  x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
      <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6"  x2="3.01" y2="6"/>
      <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
    </svg>
    All
  </button>
  <button class="btn-filter" id="btnFilter" onclick="toggleFilter()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
    </svg>
    Filter
  </button>
</div>

<p id="info"></p>

<div id="paginationBar">
  <button id="btnPrev" onclick="goPrev()">Prev</button>
  <span class="page-stats" id="pageStats"></span>
  <button id="btnNext" onclick="goNext()">Next</button>
</div>

<div class="table-wrapper" id="tableWrapper">
  <table>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   PHARMACY PWA — Apps Script hosted, instant re-opens

   HOW INSTANT LOADING WORKS:
   ─────────────────────────────────────────────────────
   Apps Script always has a ~1-3s cold start that we
   cannot avoid on first load. But every time AFTER that:

   1. Page HTML arrives from Google (unavoidable network)
   2. JS runs immediately — reads IndexedDB (< 50ms)
   3. Splash screen hides — app is READY before the
      google.script.run bridge has even initialized

   The perceived "load time" drops to nearly zero because
   the user sees the full UI with their data almost
   instantly after the HTML parses. The only true solution
   for zero HTML load time is a separate static host (see
   README), but this gives 90% of the benefit with no
   extra hosting setup.

   SYNC uses google.script.run — no CORS issues.
   ═══════════════════════════════════════════════════════ */

/* ── IndexedDB ── */
const DB_NAME    = "PharmacyPWA";
const DB_VERSION = 2;
const STORE_META = "meta";
const STORE_DATA = "data";
const STALE_DAYS = 7;

let DB    = null;
let CACHE = null;  // { syncedAt, headers, cats, mega }

/* ── App state ── */
const PAGE_SIZE       = 5000;
let currentMode       = null;
let currentCategory   = "froshtn";
let currentPage       = 1;
let totalRows         = 0;
let currentHeaders    = null;
let ALL_ROWS_CACHE    = null;
let ALL_ROWS_FILTERED = null;
let currentSorts      = [];
let columnFilters     = {};
let filterVisible     = false;

/* ── DOM ── */
const category     = document.getElementById("category");
const searchText   = document.getElementById("searchText");
const paginationBar= document.getElementById("paginationBar");
const btnSync      = document.getElementById("btnSync");
const syncStatus   = document.getElementById("syncStatus");
const dbCountEl    = document.getElementById("dbCount");
const dbBadgeEl    = document.getElementById("dbBadge");
const syncProgress = document.getElementById("syncProgress");
const syncBar      = document.getElementById("syncBar");
const tableWrapper = document.getElementById("tableWrapper");
const splash       = document.getElementById("splash");
const splashLabel  = document.getElementById("splashLabel");

/* ╔══════════════════════════════════╗
   ║         INDEXEDDB                ║
   ╚══════════════════════════════════╝ */
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_META)) db.createObjectStore(STORE_META);
      if (!db.objectStoreNames.contains(STORE_DATA)) db.createObjectStore(STORE_DATA);
    };
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}
function dbPut(store, key, value) {
  return new Promise((res, rej) => {
    const tx = DB.transaction(store, "readwrite");
    const r  = tx.objectStore(store).put(value, key);
    r.onsuccess = () => res(); r.onerror = e => rej(e.target.error);
  });
}
function dbGet(store, key) {
  return new Promise((res, rej) => {
    const tx = DB.transaction(store, "readonly");
    const r  = tx.objectStore(store).get(key);
    r.onsuccess = e => res(e.target.result); r.onerror = e => rej(e.target.error);
  });
}

async function savePayload(payload) {
  await dbPut(STORE_META, "syncedAt", payload.syncedAt);
  await dbPut(STORE_META, "headers",  JSON.stringify(payload.headers));
  for (const cat of ["froshtn","henan","qaema"])
    await dbPut(STORE_DATA, "cat_"+cat, JSON.stringify(payload.cats[cat]||[]));
  await dbPut(STORE_DATA, "mega_headers", JSON.stringify(payload.mega.headers));
  await dbPut(STORE_DATA, "mega_rows",    JSON.stringify(payload.mega.rows));
}

async function loadPayload() {
  const syncedAt = await dbGet(STORE_META, "syncedAt");
  if (!syncedAt) return null;
  const headers = JSON.parse(await dbGet(STORE_META,"headers")||"{}");
  const cats = {};
  for (const cat of ["froshtn","henan","qaema"]) {
    const raw = await dbGet(STORE_DATA, "cat_"+cat);
    cats[cat] = raw ? JSON.parse(raw) : [];
  }
  const mh = await dbGet(STORE_DATA,"mega_headers");
  const mr = await dbGet(STORE_DATA,"mega_rows");
  return { syncedAt, headers, cats, mega:{ headers:mh?JSON.parse(mh):[], rows:mr?JSON.parse(mr):[] } };
}

/* ╔══════════════════════════════════╗
   ║         STARTUP                  ║
   ╚══════════════════════════════════╝
   Runs as soon as the script tag parses —
   before google.script.run is even available.
   Reads IndexedDB and hides the splash fast.    */

(async function init() {
  splashLabel.textContent = "Loading local data…";

  try {
    DB = await openDB();
    const payload = await loadPayload();

    if (payload) {
      CACHE = payload;
      hideSplash();          // ← instant: data is ready
      updateBadge();
      updateSyncStatus();
      setInfo("Ready — tap Search or All");
    } else {
      hideSplash();
      showNoDataState();
      setSyncStatus("No local data — tap Sync", "warn");
    }
  } catch(e) {
    hideSplash();
    setSyncStatus("Storage error: "+e.message, "err");
  }
})();

function hideSplash() {
  splash.classList.add("hidden");
  setTimeout(() => { splash.style.display = "none"; }, 300);
}

function showNoDataState() {
  tableWrapper.innerHTML = `
    <div class="no-data">
      <div class="icon">📦</div>
      <h3>No local database yet</h3>
      <p>Tap <strong>Sync</strong> to download your pharmacy data.<br>
         After the first sync, this screen loads instantly — even offline.</p>
      <button onclick="doSync()">Sync Now</button>
    </div>`;
}
function restoreTable() {
  if (!tableWrapper.querySelector("table"))
    tableWrapper.innerHTML = `<table><thead id="thead"></thead><tbody id="tbody"></tbody></table>`;
}

function updateBadge() {
  if (!CACHE) { dbCountEl.textContent="0"; dbBadgeEl.className="db-badge"; return; }
  const n =
    (CACHE.cats.froshtn ? CACHE.cats.froshtn.length : 0) +
    (CACHE.cats.henan   ? CACHE.cats.henan.length   : 0) +
    (CACHE.cats.qaema   ? CACHE.cats.qaema.length   : 0) +
    (CACHE.mega.rows    ? CACHE.mega.rows.length     : 0);
  dbCountEl.textContent = n>999 ? (n/1000).toFixed(1)+"k" : String(n);
  const days = CACHE.syncedAt ? (Date.now()-new Date(CACHE.syncedAt).getTime())/86400000 : 999;
  dbBadgeEl.className = "db-badge "+(days<1?"fresh":days<STALE_DAYS?"":"stale");
}
function updateSyncStatus() {
  if (!CACHE||!CACHE.syncedAt) { setSyncStatus("Not synced yet","warn"); return; }
  const days = (Date.now()-new Date(CACHE.syncedAt).getTime())/86400000;
  setSyncStatus(
    days < STALE_DAYS
      ? "Last sync: "+fmtRelative(CACHE.syncedAt)
      : "⚠️ "+Math.round(days)+"d old — sync soon",
    days < STALE_DAYS ? "ok" : "warn"
  );
}
function fmtRelative(iso) {
  const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<2)return"just now"; if(m<60)return m+"m ago";
  const h=Math.round(m/60); if(h<24)return h+"h ago";
  const d=Math.round(h/24); return d===1?"yesterday":d+"d ago";
}
function setSyncStatus(t,c){ syncStatus.textContent=t; syncStatus.className="sync-status "+(c||""); }

/* ╔══════════════════════════════════╗
   ║         SYNC                     ║
   ║  Uses google.script.run — works  ║
   ║  perfectly on Apps Script host.  ║
   ╚══════════════════════════════════╝ */
let syncing = false;

function doSync() {
  if (syncing) return;

  // google.script.run may not be available if running outside Apps Script
  if (!window.google || !google.script || !google.script.run) {
    setSyncStatus("Must be opened via the Apps Script URL", "err");
    return;
  }

  syncing = true;
  btnSync.disabled = true;
  btnSync.classList.add("syncing");
  btnSync.innerHTML = `<span class="spinner"></span> Syncing…`;
  setSyncStatus("Connecting to server…","busy");
  syncProgress.classList.add("visible");

  let prog = 5;
  syncBar.style.width = prog+"%";
  const ticker = setInterval(()=>{
    prog = Math.min(prog+(prog<60?4:prog<85?1.5:0.3), 92);
    syncBar.style.width = prog+"%";
  }, 400);

  setSyncStatus("Downloading… (15–30s first time)","busy");

  google.script.run
    .withSuccessHandler(async res => {
      clearInterval(ticker);

      if (res.status !== "ok") {
        showSyncError(res.message||"Server error");
        return;
      }

      syncBar.style.width = "96%";
      setSyncStatus("Saving to device…","busy");

      try {
        await savePayload(res.payload);
        CACHE = res.payload;

        syncBar.style.width="100%";
        syncBar.style.background="#22c55e";
        setTimeout(()=>{
          syncProgress.classList.remove("visible");
          syncBar.style.background="";
          syncBar.style.width="0%";
        }, 1000);

        updateBadge();
        setSyncStatus("Sync complete"+(res.payload._cached?" (cached)":""),"ok");
        setInfo("✓ Synced — search is instant");
        restoreTable();

      } catch(e) {
        showSyncError("Save failed: "+e.message);
      }

      finishSync();
    })
    .withFailureHandler(err => {
      clearInterval(ticker);
      showSyncError(err.message||String(err));
      finishSync();
    })
    .getSyncPayload();
}

function showSyncError(msg) {
  syncBar.style.width="100%"; syncBar.style.background="#ef4444";
  setTimeout(()=>{ syncProgress.classList.remove("visible"); syncBar.style.background=""; },1500);
  setSyncStatus("Sync failed: "+msg,"err");
}
function finishSync() {
  syncing = false;
  btnSync.disabled = false;
  btnSync.classList.remove("syncing");
  btnSync.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>Sync`;
}

/* ╔══════════════════════════════════╗
   ║         SCANNER                  ║
   ╚══════════════════════════════════╝ */
const btnScan = document.getElementById("btnScan");
let scanPopup = null;

window.addEventListener("message", e => {
  if (!e.data) return;
  if (e.data.type==="BARCODE_RESULT"&&e.data.value) {
    if (scanPopup) { try{scanPopup.close();}catch(_){} scanPopup=null; }
    btnScan.classList.remove("scanning");
    searchText.value = e.data.value;
    setInfo("✓ Scanned: "+e.data.value);
    handleSearch();
  }
  if (e.data.type==="SCANNER_CLOSED") { btnScan.classList.remove("scanning"); scanPopup=null; }
});

btnScan.addEventListener("click", ()=>{
  if (scanPopup&&!scanPopup.closed) { scanPopup.close(); scanPopup=null; btnScan.classList.remove("scanning"); return; }
  btnScan.classList.add("scanning");
  const w=Math.min(screen.width,480), h=Math.min(screen.height,760);
  scanPopup=window.open("","scanner",`width=${w},height=${h},left=0,top=0,toolbar=no,menubar=no,scrollbars=no`);
  if (!scanPopup) { btnScan.classList.remove("scanning"); setInfo("Popup blocked."); return; }
  scanPopup.document.open(); scanPopup.document.write(getScannerHtml()); scanPopup.document.close();
  const t=setInterval(()=>{ if(!scanPopup||scanPopup.closed){clearInterval(t);btnScan.classList.remove("scanning");scanPopup=null;} },500);
});

function getScannerHtml(){return`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:#000;overflow:hidden;color:#fff;font-family:-apple-system,system-ui,sans-serif}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.dim{position:absolute;left:0;right:0;height:25%;background:rgba(0,0,0,0.55);z-index:2;pointer-events:none}#dt{top:0}#db{bottom:0}#frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(74vw,290px);height:min(74vw,290px);z-index:3;pointer-events:none}#frame::before,#frame::after,#bl,#br{content:'';position:absolute;width:28px;height:28px}#frame::before{top:0;left:0;border-top:3px solid #e74c3c;border-left:3px solid #e74c3c;border-radius:3px 0 0 0}#frame::after{top:0;right:0;border-top:3px solid #e74c3c;border-right:3px solid #e74c3c;border-radius:0 3px 0 0}#bl{bottom:0;left:0;border-bottom:3px solid #e74c3c;border-left:3px solid #e74c3c;border-radius:0 0 0 3px}#br{bottom:0;right:0;border-bottom:3px solid #e74c3c;border-right:3px solid #e74c3c;border-radius:0 0 3px 0}#laser{position:absolute;left:50%;top:50%;transform:translateX(-50%);width:calc(min(74vw,290px) - 20px);height:2px;background:linear-gradient(90deg,transparent,#e74c3c,#ff6b6b,#e74c3c,transparent);box-shadow:0 0 10px #e74c3c;z-index:4;pointer-events:none;animation:sweep 2s ease-in-out infinite}@keyframes sweep{0%,100%{margin-top:calc(min(74vw,290px)/-2 + 14px)}50%{margin-top:calc(min(74vw,290px)/2 - 14px)}}#status{position:absolute;bottom:11%;left:0;right:0;z-index:5;text-align:center;font-size:14px;color:#ddd;text-shadow:0 1px 6px #000;padding:0 20px;pointer-events:none}#btnClose{position:absolute;top:14px;right:14px;z-index:10;background:rgba(0,0,0,0.55);border:1px solid #555;color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}#success{display:none;position:absolute;inset:0;z-index:20;background:rgba(0,0,0,0.92);flex-direction:column;align-items:center;justify-content:center;gap:16px}#success.show{display:flex}#tick{font-size:56px;color:#2ecc71}#sval{font-size:22px;font-weight:bold;color:#2ecc71;padding:0 24px;text-align:center;word-break:break-all}#lw{position:absolute;bottom:18%;left:15%;width:70%;height:4px;background:rgba(255,255,255,.15);border-radius:2px;z-index:6;display:none}#lb{height:100%;width:0%;background:#e74c3c;border-radius:2px;transition:width .05s linear}#lw.active{display:block}</style></head><body><video id="v" autoplay muted playsinline></video><div class="dim" id="dt"></div><div class="dim" id="db"></div><div id="frame"><div id="bl"></div><div id="br"></div></div><div id="laser"></div><div id="status">Starting camera\u2026</div><div id="lw"><div id="lb"></div></div><button id="btnClose" onclick="doClose()">&#x2715;</button><div id="success"><div id="tick">&#x2713;</div><div id="sval"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.20.0/zxing.min.js"><\/script><script>var v=document.getElementById('v'),st=document.getElementById('status'),stream=null,reader=null,done=false;function send(m){try{if(window.opener)window.opener.postMessage(m,'*');}catch(e){}}function doClose(){stopAll();send({type:'SCANNER_CLOSED'});window.close();}function stopAll(){done=true;try{if(reader){reader.reset();reader=null;}}catch(e){}try{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}catch(e){}v.srcObject=null;}function onFound(val){if(done)return;done=true;try{navigator.vibrate(150);}catch(e){}document.getElementById('sval').textContent=val;document.getElementById('success').classList.add('show');stopAll();send({type:'BARCODE_RESULT',value:val});setTimeout(()=>window.close(),1000);}async function start(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});v.srcObject=stream;await v.play();st.textContent='Point at a barcode\u2026';var CM=300,lv='',cs=0,lw=document.getElementById('lw'),lb=document.getElementById('lb');function chk(val){var now=Date.now();if(val!==lv){lv=val;cs=now;lw.classList.add('active');lb.style.width='0%';st.textContent='Hold steady\u2026';return false;}var p=Math.min(100,((now-cs)/CM)*100);lb.style.width=p+'%';lb.style.background=p>=100?'#2ecc71':'#e74c3c';if(p>=100)lw.classList.remove('active');return(now-cs)>=CM;}function reset(){lv='';cs=0;lb.style.width='0%';lw.classList.remove('active');st.textContent='Point at a barcode\u2026';}if('BarcodeDetector' in window){var det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','qr_code','data_matrix']});(function loop(){if(done)return;det.detect(v).then(c=>{if(c.length){if(chk(c[0].rawValue))onFound(c[0].rawValue);}else reset();setTimeout(loop,80);}).catch(()=>setTimeout(loop,80));})();}else if(typeof ZXing!=='undefined'){reader=new ZXing.BrowserMultiFormatReader();var devs=await reader.listVideoInputDevices();var back=devs.find(d=>/back|rear|environment/i.test(d.label||''))||devs[devs.length-1];reader.decodeFromVideoDevice(back?back.deviceId:undefined,v,r=>{if(!done&&r){if(chk(r.getText()))onFound(r.getText());}else if(!r)reset();});}else st.textContent='Scanner not loaded.';}catch(err){st.textContent='Camera error: '+err.message;}}start();<\/script></body></html>`;}

/* ╔══════════════════════════════════╗
   ║   TABLE / SEARCH / SORT / FILTER ║
   ╚══════════════════════════════════╝ */
category.addEventListener("change", ()=>{
  currentCategory=category.value; currentMode=null; currentPage=1;
  ALL_ROWS_CACHE=null; ALL_ROWS_FILTERED=null;
  currentSorts=[]; columnFilters={};
  hidePagination(); clearTable(); setInfo("");
});

function setInfo(t){ document.getElementById("info").innerHTML=t||""; }
function setBusy(t){ disableControls(true); document.getElementById("info").innerHTML=`<span class="spinner"></span><span>${t}</span>`; }
function clearBusy(){ disableControls(false); }
function disableControls(d){
  ["btnSearch","btnShowAll","btnPrev","btnNext","btnFilter","btnScan"].forEach(id=>{
    const el=document.getElementById(id); if(el)el.disabled=d;
  });
  category.disabled=d; searchText.disabled=d;
}

function normH(h){ return String(h||"").toLowerCase().replace(/\s+/g,"").trim(); }
function findBcIdxs(headers){ const s=new Set(["barcode","barcode","code","kod","ean","upc"].map(x=>x.replace(/\s+/g,""))); return headers.reduce((a,h,i)=>{ if(s.has(normH(h)))a.push(i); return a; },[]); }
function isNum(r){ const s=String(r??"").trim(); return s?/^-?\d+(\.\d+)?$/.test(s.replace(/[, ]/g,"")):false; }
function fmtNum(r){ const s=String(r??"").trim(); if(!s)return s; const c=s.replace(/[, ]/g,""); if(!/^-?\d+(\.\d+)?$/.test(c))return s; const n=Number(c); return isFinite(n)?(c.includes(".")?(Math.round(n*10)/10).toString():Math.trunc(n).toString()):s; }
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function draw(headers, rows) {
  restoreTable();
  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");
  const bIdxs = findBcIdxs(headers);
  const fh = headers.filter((_,i)=>!bIdxs.includes(i));
  const fr = rows.map(r=>r.filter((_,i)=>!bIdxs.includes(i)));
  currentHeaders = fh;

  thead.innerHTML = "<tr>" + fh.map((h,i)=>{
    const col=String(h||"");
    const ix=currentSorts.findIndex(s=>String(s.name||"").toLowerCase()===col.toLowerCase());
    const ind=ix>=0?(currentSorts[ix].dir==="desc"?"▼":"▲")+"<sup>"+(ix+1)+"</sup>":"⇅";
    const cl=col.toLowerCase().trim(), isItem=cl==="item_name"||cl==="item_names";
    return `<th class="${isItem?"sortable item-name-col":"sortable"}" data-idx="${i}" data-col="${esc(col)}">${esc(col)} <span class="indicator">${ind}</span></th>`;
  }).join("") + "</tr>" +
  `<tr id="filterRow" class="filter-row${filterVisible?" visible":""}">` +
  fh.map((_,i)=>`<th><input class="filter-input" data-fidx="${i}" placeholder="" value="${esc(columnFilters[i]||"")}" autocomplete="off"></th>`).join("") +
  "</tr>";

  document.querySelectorAll(".filter-input").forEach(inp=>{
    inp.addEventListener("input",()=>{ columnFilters[parseInt(inp.dataset.fidx,10)]=inp.value.toLowerCase().trim(); applyColumnFilters(); });
    inp.addEventListener("click",e=>e.stopPropagation());
  });

  tbody.innerHTML = fr.map(row=>"<tr>"+row.map((c,i)=>{
    if(c==null)return"<td></td>";
    const t=String(c), hasBr=t.includes("<br>");
    const show=hasBr?t:(isNum(t)?fmtNum(t):t);
    const cl=(currentHeaders[i]||"").toLowerCase().trim();
    return `<td class="${cl==="item_name"||cl==="item_names"?"item-name-col":""}">${show}</td>`;
  }).join("")+"</tr>").join("");

  applyColumnFilters();
}

/* Filtering */
function getAF(){ return Object.entries(columnFilters).filter(([,v])=>v!==""); }
function parseExpr(v){ const m=v.match(/^(>=|<=|>|<|=|!=)\s*(-?\d+(\.\d+)?)$/); return m?{op:m[1],num:parseFloat(m[2])}:null; }
function cellMatch(txt,fv){
  const e=parseExpr(fv.trim());
  if(e){ const n=parseFloat(String(txt).replace(/[\s,]/g,"")); if(isNaN(n))return false;
    switch(e.op){ case">":return n>e.num;case"<":return n<e.num;case">=":return n>=e.num;case"<=":return n<=e.num;case"=":return n===e.num;case"!=":return n!==e.num; } }
  return String(txt??"").toLowerCase().includes(fv);
}
function rowMatch(row,af){ return af.every(([idx,fv])=>cellMatch(row[parseInt(idx)],fv)); }

function applyColumnFilters(){
  const af=getAF();
  const tbody=document.getElementById("tbody"); if(!tbody)return;
  if(currentMode==="showAll"&&ALL_ROWS_CACHE){
    const filtered=af.length===0?ALL_ROWS_CACHE:ALL_ROWS_CACHE.filter(r=>rowMatch(r,af));
    currentPage=1;
    tbody.innerHTML=filtered.slice(0,PAGE_SIZE).map(row=>"<tr>"+row.map((c,i)=>{
      if(c==null)return"<td></td>"; const t=String(c),hasBr=t.includes("<br>");
      const show=hasBr?t:(isNum(t)?fmtNum(t):t);
      const cl=(currentHeaders[i]||"").toLowerCase().trim();
      return`<td class="${cl==="item_name"||cl==="item_names"?"item-name-col":""}">${show}</td>`;
    }).join("")+"</tr>").join("");
    totalRows=filtered.length;
    if(filtered.length>PAGE_SIZE)showPagination(1,PAGE_SIZE,filtered.length); else hidePagination();
    setInfo(af.length>0?`${filtered.length} of ${ALL_ROWS_CACHE.length} rows (filtered)`:`${filtered.length} rows`);
    ALL_ROWS_FILTERED=af.length>0?filtered:null; return;
  }
  const domRows=tbody.querySelectorAll("tr"); let vis=0;
  domRows.forEach(row=>{
    if(!af.length){row.classList.remove("filtered-out");vis++;return;}
    const cells=row.querySelectorAll("td");
    const ok=af.every(([idx,fv])=>{ const c=cells[parseInt(idx)]; return c?cellMatch(c.textContent.trim(),fv):false; });
    if(ok){row.classList.remove("filtered-out");vis++;}else row.classList.add("filtered-out");
  });
  if(af.length>0)setInfo(`${vis} of ${domRows.length} rows (filtered)`);
}

/* Sort */
function parseDateJ(v){
  if(!v)return 0;
  if(typeof v==="string"&&v.includes("/")){const p=v.split("/");if(p.length===3){const d=new Date(+p[2],+p[1]-1,+p[0]);return isNaN(d.getTime())?0:d.getTime();}}
  const t=new Date(v).getTime();return isNaN(t)?0:t;
}
function findDateIdx(headers){ return headers.findIndex(h=>["barwar","date","tarikh","tarix"].includes((h||"").toLowerCase().trim())); }
function multiSort(headers,rows,specs){
  if(!Array.isArray(specs)||!specs.length)return rows.slice();
  const cols=specs.map(s=>{
    const name=String(s&&s.name||"").toLowerCase().trim();
    const dir=(String(s&&s.dir||"asc").toLowerCase()==="desc")?-1:1;
    const idx=headers.findIndex(h=>String(h||"").toLowerCase().trim()===name);
    const isDate=["barwar","date","tarikh","tarix"].includes(String(headers[idx]||"").toLowerCase().trim());
    return{idx,dir,isDate};
  }).filter(c=>c.idx>=0);
  if(!cols.length)return rows.slice();
  return rows.slice().sort((a,b)=>{
    for(const c of cols){
      const av=a[c.idx],bv=b[c.idx];let res;
      if(c.isDate)res=parseDateJ(av)-parseDateJ(bv);
      else{const na=parseFloat(String(av??"").replace(/[\s,]/g,"")),nb=parseFloat(String(bv??"").replace(/[\s,]/g,""));
        res=(!isNaN(na)&&!isNaN(nb))?na-nb:String(av??"").localeCompare(String(bv??""),undefined,{numeric:true,sensitivity:"base"});}
      if(res!==0)return res*c.dir;
    }return 0;
  });
}

document.addEventListener("click",e=>{
  const th=e.target.closest("th.sortable"); if(!th)return;
  const col=th.dataset.col||(currentHeaders?currentHeaders[parseInt(th.dataset.idx,10)]:null);
  if(col!=null)onHeaderClick(col);
});
function onHeaderClick(col){
  const lower=col.toLowerCase();
  const ix=currentSorts.findIndex(s=>String(s.name||"").toLowerCase()===lower);
  if(ix>=0){const it=currentSorts.splice(ix,1)[0];it.dir=it.dir==="asc"?"desc":"asc";currentSorts.unshift(it);}
  else currentSorts.unshift({name:col,dir:"desc"});
  if(currentMode==="search")handleSearch();
  else if(currentMode==="showAll"){currentPage=1;showAll(1);}
}

/* Search */
function handleSearch(){
  const q=searchText.value.trim().toLowerCase();
  const cat=category.value;
  if(!q){setInfo("Type something to search.");return;}
  if(!CACHE){setInfo("No local data — tap Sync first.");return;}
  currentMode="search"; hidePagination();
  setBusy("Searching…");
  setTimeout(()=>{
    let rows,headers;
    if(cat==="megadata"){rows=CACHE.mega.rows.filter(r=>r.some(c=>String(c||"").toLowerCase().includes(q)));headers=CACHE.mega.headers;}
    else{rows=(CACHE.cats[cat]||[]).filter(r=>r.some(c=>String(c||"").toLowerCase().includes(q)));headers=CACHE.headers[cat];}
    if(!headers){setInfo("Category not found.");clearBusy();return;}
    if((cat==="qaema"||cat==="henan")&&!currentSorts.length){const di=findDateIdx(headers);if(di!==-1)currentSorts=[{name:headers[di],dir:"desc"}];}
    if(currentSorts.length)rows=multiSort(headers,rows,currentSorts);
    draw(headers,rows); setInfo(`${rows.length} results`); clearBusy();
  },0);
}

/* Show All */
function showAll(pageOverride){
  const cat=category.value;
  if(!CACHE){setInfo("No local data — tap Sync first.");return;}
  currentMode="showAll"; currentCategory=cat;
  currentPage=pageOverride||currentPage||1;
  let all,headers;
  if(cat==="megadata"){all=CACHE.mega.rows;headers=CACHE.mega.headers;}
  else{all=CACHE.cats[cat]||[];headers=CACHE.headers[cat];}
  if(!headers){setInfo("Category not found.");return;}
  if((cat==="qaema"||cat==="henan")&&!currentSorts.length){const di=findDateIdx(headers);if(di!==-1)currentSorts=[{name:headers[di],dir:"desc"}];}
  if(currentSorts.length)all=multiSort(headers,all,currentSorts);
  ALL_ROWS_CACHE=all; ALL_ROWS_FILTERED=null; totalRows=all.length;
  const start=(currentPage-1)*PAGE_SIZE, end=Math.min(start+PAGE_SIZE,totalRows);
  draw(headers,all.slice(start,end)); showPagination(currentPage,PAGE_SIZE,totalRows);
  setInfo(`${end-start} of ${totalRows} rows`);
}

function goPrev(){ if(currentMode!=="showAll"||currentPage<=1)return; currentPage--; if(ALL_ROWS_FILTERED)renderFP(); else showAll(currentPage); }
function goNext(){ if(currentMode!=="showAll"||currentPage*PAGE_SIZE>=totalRows)return; currentPage++; if(ALL_ROWS_FILTERED)renderFP(); else showAll(currentPage); }
function renderFP(){
  const start=(currentPage-1)*PAGE_SIZE;
  const tbody=document.getElementById("tbody");
  tbody.innerHTML=ALL_ROWS_FILTERED.slice(start,Math.min(start+PAGE_SIZE,ALL_ROWS_FILTERED.length)).map(row=>
    "<tr>"+row.map((c,i)=>{
      if(c==null)return"<td></td>"; const t=String(c),hasBr=t.includes("<br>");
      const show=hasBr?t:(isNum(t)?fmtNum(t):t);
      const cl=(currentHeaders[i]||"").toLowerCase().trim();
      return`<td class="${cl==="item_name"||cl==="item_names"?"item-name-col":""}">${show}</td>`;
    }).join("")+"</tr>"
  ).join("");
  showPagination(currentPage,PAGE_SIZE,ALL_ROWS_FILTERED.length);
  setInfo(`${ALL_ROWS_FILTERED.length} of ${ALL_ROWS_CACHE.length} rows (filtered)`);
}

function showPagination(p,ps,total){
  paginationBar.style.display="flex";
  const start=total===0?0:(p-1)*ps+1, end=Math.min(p*ps,total);
  document.getElementById("pageStats").textContent=`${start}–${end} of ${total}`;
  document.getElementById("btnPrev").disabled=(p<=1);
  document.getElementById("btnNext").disabled=(p*ps>=total);
}
function hidePagination(){ paginationBar.style.display="none"; }
function clearTable(){ const t=document.getElementById("thead"),b=document.getElementById("tbody"); if(t)t.innerHTML=""; if(b)b.innerHTML=""; }
function toggleFilter(){
  filterVisible=!filterVisible;
  document.getElementById("btnFilter").classList.toggle("active",filterVisible);
  const fr=document.getElementById("filterRow"); if(fr)fr.classList.toggle("visible",filterVisible);
}

searchText.addEventListener("keydown",e=>{ if(e.key==="Enter")handleSearch(); });
</script>
